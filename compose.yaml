services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: decio
      POSTGRES_PASSWORD: decio
      POSTGRES_DB: decio
    ports:
      - "5433:5432"
    volumes:
      - decio-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decio -d decio"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  decio-postgres:
